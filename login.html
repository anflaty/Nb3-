<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شركة نبع الجزي - تسجيل الدخول</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
    body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-xl shadow-md border border-slate-200 w-full max-w-md p-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-800">شركة نبع الجزي</h1>
      <p class="text-slate-500 text-sm mt-1">بوابة تسجيل دخول النظام الإداري</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">اسم المستخدم</label>
        <input type="text" id="username" required autocomplete="off" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-800 focus:border-blue-800 outline-none transition" placeholder="أدخل اسم المستخدم">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">كلمة المرور</label>
        <input type="password" id="password" required autocomplete="off" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-800 focus:border-blue-800 outline-none transition" placeholder="أدخل كلمة المرور">
      </div>

      <div id="loginError" class="hidden text-red-600 text-xs text-center font-bold bg-red-50 p-2.5 rounded-lg border border-red-200">
        بيانات الدخول غير صحيحة.
      </div>

      <button type="submit" class="w-full bg-blue-900 hover:bg-blue-950 text-white font-bold py-2.5 rounded-lg transition text-sm">
        تسجيل الدخول
      </button>
    </form>

    <div class="mt-6 text-center border-t border-slate-100 pt-4">
      <a href="index.html" class="text-xs text-slate-500 hover:text-slate-800 font-semibold underline">العودة إلى الصفحة الرئيسية</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // تنظيف المدخلات من المسافات وتحويل الحروف إلى صغيرة
      const uInput = document.getElementById('username').value.trim().toLowerCase();
      const pInput = document.getElementById('password').value.trim();

      // التحقق الصريح المباشر
      if (uInput === "klod" && pInput === "6363") {
        localStorage.setItem('nb3_admin_logged', 'true');
        // استخدام التوجيه النسبي المباشر لضمان التوافق مع GitHub Pages
        window.location.href = './index.html';
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
