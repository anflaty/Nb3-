<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شركة نبع الجزي - تسجيل الدخول</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
    body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-xl shadow-md border border-slate-200 w-full max-w-md p-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-800">شركة نبع الجزي</h1>
      <p class="text-slate-500 text-sm mt-1">بوابة تسجيل دخول النظام الإداري</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">اسم المستخدم</label>
        <input type="text" id="username" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-800 focus:border-blue-800 outline-none transition" placeholder="أدخل اسم المستخدم">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">كلمة المرور</label>
        <input type="password" id="password" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-800 focus:border-blue-800 outline-none transition" placeholder="أدخل كلمة المرور">
      </div>

      <div id="loginError" class="hidden text-red-600 text-xs text-center font-bold bg-red-50 p-2.5 rounded-lg border border-red-200">
        بيانات الدخول غير صحيحة.
      </div>

      <button type="submit" class="w-full bg-blue-900 hover:bg-blue-950 text-white font-bold py-2.5 rounded-lg transition text-sm">
        تسجيل الدخول
      </button>
    </form>

    <div class="mt-6 text-center border-t border-slate-100 pt-4">
      <a href="index.html" class="text-xs text-slate-500 hover:text-slate-800 font-semibold underline">العودة إلى الصفحة الرئيسية</a>
    </div>
  </div>

  <script>
    const TARGET_USER_HASH = "7d25e0bc13ee0c03478cbbf8e9ef9700d3d438ed2e6e30d10c06834dd9b867c2";
    const TARGET_PASS_HASH = "251f280a581e2b5883626be4f107f917544ef247e62a2657d42cfc053a4792c9";

    async function hashString(str) {
      if (window.crypto && window.crypto.subtle) {
        const msgBuffer = new TextEncoder().encode(str);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      } else {
        return str === 'klod' ? TARGET_USER_HASH : (str === '6363' ? TARGET_PASS_HASH : 'invalid');
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const uInput = document.getElementById('username').value.trim();
      const pInput = document.getElementById('password').value.trim();

      const uHash = await hashString(uInput);
      const pHash = await hashString(pInput);

      if (uHash === TARGET_USER_HASH && pHash === TARGET_PASS_HASH) {
        localStorage.setItem('nb3_admin_logged', 'true');
        window.location.href = 'index.html';
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
